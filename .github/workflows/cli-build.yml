name: Build CLI

on:
  push:
    branches: [ main ]
    tags:
      - 'cli/v*'
    paths:
      - 'cli/**'
      - 'common/**'
      - 'indexer/**'
      - 'pool/**'
      - 'stores/**'
      - 'worker/**'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.goreleaser.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'common/**'
      - 'indexer/**'
      - 'pool/**'
      - 'stores/**'
      - 'worker/**'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.goreleaser.yaml'

jobs:
  goreleaser:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Prepare Tag
        id: prepare_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Find the previous tag with the same prefix
          if [[ "$TAG" == cli/v* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 --match "cli/v*" "${TAG}^" 2>/dev/null || echo "")
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "Using tag: $TAG, previous tag: $PREV_TAG"
          else
            echo "Using tag: $TAG"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli/v') && 'release --clean --skip=validate' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.prepare_tag.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.prepare_tag.outputs.prev_tag }}

      - name: Archive CLI Binaries
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/cli/v')
        uses: actions/upload-artifact@v4
        with:
          name: gostore-cli-binaries
          path: dist/*.tar.gz
          if-no-files-found: error
