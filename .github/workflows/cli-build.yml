name: Build CLI

on:
  push:
    branches: [ main ]
    tags:
      - 'cli/v*'
    paths:
      - 'cli/**'
      - 'common/**'
      - 'indexer/**'
      - 'pool/**'
      - 'stores/**'
      - 'worker/**'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.goreleaser.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'common/**'
      - 'indexer/**'
      - 'pool/**'
      - 'stores/**'
      - 'worker/**'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.goreleaser.yaml'

jobs:
  goreleaser:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Prepare Tag
        id: prepare_tag
        run: |
          # Strip the 'cli/' prefix to satisfy GoReleaser's semver requirement
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == cli/* ]]; then
            CLEAN_TAG="${TAG#cli/}"
            echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
            echo "Using clean tag: $CLEAN_TAG (stripped cli/ prefix)"
          else
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli/v') && 'release --clean --skip=validate' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.prepare_tag.outputs.tag }}

      - name: Archive CLI Binaries
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/cli/v')
        uses: actions/upload-artifact@v4
        with:
          name: gostore-cli-binaries
          path: dist/*.tar.gz
          if-no-files-found: error
